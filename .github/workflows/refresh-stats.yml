name: refresh-stats

on:
  schedule:
    - cron: "23 4 * * *"     # 04:23 UTC = 09:53 IST, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild hero SVGs and the README footer from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/refresh_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md assets/hero-dark.svg assets/hero-light.svg; then
            echo "nothing changed"
          else
            git add README.md assets/hero-dark.svg assets/hero-light.svg
            git commit -m "refresh live numbers ($(date -u +%Y-%m-%d))"
            git push
          fi
