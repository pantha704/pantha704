name: rotate-tui

on:
  schedule:
    - cron: "17 * * * *"     # hourly, at :17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick a random stored animation and rebuild assets/tui.svg
        run: python3 tools/rotate_tui.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/tui.svg; then
            echo "no change"
          else
            git add assets/tui.svg
            git commit -m "rotate tui: $(grep -o 'ascii.live/[a-z0-9-]*' assets/tui.svg | head -1)"
            git push
          fi
